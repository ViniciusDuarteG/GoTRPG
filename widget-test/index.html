<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teste do Widget</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #09090b;
        color: #fafafa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(124, 58, 237, 0.18), transparent 32rem),
          #09090b;
      }

      main {
        width: min(1440px, 100%);
        margin: 0 auto;
      }

      header {
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(20px, 3vw, 30px);
      }

      p {
        margin: 6px 0 0;
        color: #a1a1aa;
      }

      button {
        padding: 10px 16px;
        border: 1px solid #52525b;
        border-radius: 9px;
        background: #18181b;
        color: #fafafa;
        cursor: pointer;
      }

      button:hover {
        border-color: #8b5cf6;
      }

      .widget-shell {
        height: calc(100vh - 120px);
        min-height: 700px;
        overflow: hidden;
        border: 1px solid #3f3f46;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: 700px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Teste do Widget</h1>
          <p>Widget carregado de localhost:3000 com acesso ao microfone.</p>
        </div>
        <button type="button" id="reload">Recarregar widget</button>
      </header>

      <section class="widget-shell">
        <iframe
          id="widget"
          title="Widget de atendimento"
          src="http://localhost:3000/widget/ae7b9a60-29ed-4938-8285-98ceffe56c54"
          allow="microphone;"
          frameborder="0"
        ></iframe>
      </section>
    </main>

    <script>
      const widget = document.querySelector('#widget');
      document.querySelector('#reload').addEventListener('click', () => {
        widget.src = widget.src;
      });
    </script>
  </body>
</html>
